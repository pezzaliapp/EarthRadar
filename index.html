    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    />

    <title>EarthRadar — PezzaliAPP</title>
    <!--
      SPA fallback per GitHub Pages: 404.html redirige una route sconosciuta
      (es. /EarthRadar/anomaly aperta direttamente o via refresh) verso
      /EarthRadar/?/anomaly. Questo snippet — eseguito PRIMA del bundle, così
      React Router legge già l'URL corretto — decodifica quel formato e
      ripristina il path pulito senza reload. Nessun effetto sui load normali
      o sui deep-link ?lat=&lon= (agisce solo se la query inizia con "/").
    -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body class="bg-space-900 text-space-50 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
