name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Concurrency: solo un deploy alla volta. Se arriva un nuovo push mentre il
# precedente è in coda, il vecchio viene cancellato; il deploy in corso non
# viene interrotto (cancel-in-progress: false).
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Lint + Test + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Ensure CNAME in dist/
        # Vite copia public/ in dist/ → CNAME è già lì. Questo è solo un
        # safety check: se il file manca, Pages fa override del custom domain.
        run: |
          if [ ! -f dist/CNAME ]; then
            echo "www.alessandropezzali.it" > dist/CNAME
          fi
          cat dist/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to gh-pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
